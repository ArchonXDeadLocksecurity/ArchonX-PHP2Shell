# Single-worker prefork — the exploit chain requires all four stages to
# run on the same worker PID so heap state persists between requests.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>

<Directory /var/www/html>
    AllowOverride All
</Directory>
