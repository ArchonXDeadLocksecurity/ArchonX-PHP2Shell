[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archonx-php2shell"
version = "1.0.0"
description = "ArchonX-PHP2Shell — pre-auth PHP RCE framework for CVE-2026-109618 / CVE-2026-109619"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ArchonX_DeadLock_Security" }]
keywords = [
    "security", "pentest", "php", "rce", "exploit",
    "cve-2026-109618", "cve-2026-109619",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
archonx = "archonx.cli:main"

[project.urls]
Homepage = "https://github.com/ArchonXDeadLocksecurity/ArchonX-PHP2Shell"
Repository = "https://github.com/ArchonXDeadLocksecurity/ArchonX-PHP2Shell"
Issues = "https://github.com/ArchonXDeadLocksecurity/ArchonX-PHP2Shell/issues"

[tool.setuptools]
packages = ["archonx"]
